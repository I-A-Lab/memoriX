<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>memoriX - Todo</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="todo-card">
      <!-- Header -->
      <div class="todo-header">
        <div>
          <div class="todo-title">memoriX</div>
          <div class="todo-subtitle">todo</div>
        </div>
        <div class="task-count" id="task-count">0 tasks</div>
      </div>

      <!-- Input Row -->
      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a new task..." aria-label="New task">
        <button id="add-btn" aria-label="Add task">
          <i class="fas fa-plus"></i>
        </button>
      </div>

      <!-- Task List -->
      <ul id="todo-list" role="list"></ul>

      <!-- Footer -->
      <div class="todo-footer">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="clear-completed" id="clear-completed">Clear completed</button>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="script.js" defer></script>
</body>
</html>
